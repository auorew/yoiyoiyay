services:
  telegram-api:
    image: aiogram/telegram-bot-api:latest
    env_file:
      - ~/secrets/tgapi.env
    volumes:
      - telegram-data:/var/lib/telegram-bot-api
    ports:
      - "8081:8081"
    restart: always

  pot-provider:
    image: brainicism/bgutil-ytdlp-pot-provider:latest
    ports:
      - "4416:4416"
    restart: always

  yoiyoi-bot:
    build: .
    env_file:
      - ~/secrets/yoiyoi.env
    ports:
      - "${PRIVATE_PORT:-8888}:${PRIVATE_PORT:-8888}"
      - "1234:1234"  # memray
    depends_on:
      telegram-api:
        condition: service_started
      pot-provider:
        condition: service_started

  watchtower:
    image: nickfedor/watchtower
    container_name: watchtower
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
    command: --interval 60 --cleanup
    restart: always

volumes:
  telegram-data:
