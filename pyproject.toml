[tool.poetry]
name = "YoiYoi Bot"
version = "4.6"
description = "This is a bot for downloading tiktok, twitter and instagram content."
authors = ["auorew <auuorew@gmail.com>"]
readme = "README.md"
package-mode = false

[tool.poetry.dependencies]
python = "^3.12"
python-telegram-bot = {version = "^22.8", extras = ["job-queue", "webhooks", "http2"]}
python-dotenv = "^1.2.2"
sqlalchemy = "2.0.45"
alembic = "^1.18.5"
sqlalchemy-repr = "^0.1.0"
tzdata = "^2026.3"
python-magic = {version = "^0.4.27", platform = "linux"}
python-magic-bin = {version = "^0.4.14", platform = "win32"}
tenacity = "^9.1.4"
beautifulsoup4 = "^4.15.0"
pillow = "^12.3.0"
logtail-python = "^0.4.0"
pixivpy-async = "^1.2.14"
aiocache = "^0.12.3"
orjson = "^3.11.9"
python-dateutil = "^2.9.0.post0"
gallery-dl = "^1.32.7"
psycopg2-binary = "2.9.11"
yt-dlp = {extras = ["curl-cffi", "default"], version = "^2026.7.20.234742.dev0", allow-prereleases = true}
fastapi = "^0.139.2"
uvicorn = "0.40.0"
httpx = {version = "0.28.1", extras = ["socks"]}
pillow-heif = "^1.4.0"
pydantic-settings = "^2.14.2"
cryptography = "^49.0.0"
structlog = "^26.1.0"
colorama = "^0.4.6"
dataclasses-json = "^0.6.7"
lxml = "^6.1.1"
anyio = "^4.14.2"
pyvips = "^3.1.1"
python-multipart = "^0.0.32"
rich = "^15.0.0"
better-exceptions = "^0.3.3"
fake-useragent = "^2.2.0"
bgutil-ytdlp-pot-provider = "^1.3.1"
memray = {version = "^1.19.3", platform = "linux"}


[tool.poetry.group.dev.dependencies]
pre-commit = "^4.6.0"

[tool.isort]
profile = "black"
skip = ["alembic.ini"]
skip_glob = [".*/", ".*", "log/", "*.log"]
line_length = 90
include_trailing_comma = true
force_grid_wrap = 0
use_parentheses = true
ensure_newline_before_comments = true
lines_between_types = 1

[tool.black]
line-length = 90
include = '\.pyi?$'

[tool.ruff]
lint.select = ["E", "F"]
lint.fixable = ["A", "B", "C", "D", "E", "F", "G", "I", "N", "Q", "S", "T", "W", "ANN", "ARG", "BLE", "COM", "DJ", "DTZ", "EM", "ERA", "EXE", "FBT", "ICN", "INP", "ISC", "NPY", "PD", "PGH", "PIE", "PL", "PT", "PTH", "PYI", "RET", "RSE", "RUF", "SIM", "SLF", "TID", "TRY", "UP", "YTT"]
lint.ignore = []
exclude = [
    ".bzr",
    ".direnv",
    ".eggs",
    ".git",
    ".hg",
    ".mypy_cache",
    ".nox",
    ".pants.d",
    ".pytype",
    ".ruff_cache",
    ".svn",
    ".tox",
    ".venv",
    "__pypackages__",
    "_build",
    "buck-out",
    "build",
    "dist",
    "node_modules",
    "venv",
]
lint.per-file-ignores = {}
lint.dummy-variable-rgx = "^(_+|(_+[a-zA-Z0-9_]*[a-zA-Z0-9]+?))$"
line-length = 90
target-version = "py312"
