[tool.poetry]
name = "YoiYoi Bot"
version = "4.6"
description = "This is a bot for downloading tiktok, twitter and instagram content."
authors = ["auorew <auuorew@gmail.com>"]
readme = "README.md"
package-mode = false

[tool.poetry.dependencies]
python = "^3.12"
python-telegram-bot = {version = "^22.3", extras = ["job-queue", "webhooks"]}
python-dotenv = "^1.1.1"
sqlalchemy = "2.0.40"
alembic = "^1.16.5"
sqlalchemy-repr = "^0.1.0"
tzdata = "^2025.2"
python-magic = {version = "^0.4.27", platform = "linux"}
python-magic-bin = {version = "^0.4.14", platform = "win32"}
tenacity = "^9.1.2"
beautifulsoup4 = "^4.13.5"
pillow = "^11.3.0"
logtail-python = "^0.3.4"
pixivpy-async = "^1.2.14"
aiocache = "^0.12.3"
orjson = "^3.11.3"
python-dateutil = "^2.9.0.post0"
gallery-dl = "^1.30.6"
psycopg2-binary = "2.9.10"
yt-dlp = {version = "^2025.9.11.232836.dev0", allow-prereleases = true}
fastapi = "^0.116.1"
uvicorn = "0.34.2"
pyrogram = "^2.0.106"
tgcrypto = "^1.2.5"
httpx = {version = "0.28.1", extras = ["socks"]}
pillow-heif = "0.22.0"
pydantic-settings = "^2.10.1"
cryptography = "^45.0.7"
structlog = "^25.4.0"
colorama = "^0.4.6"
dataclasses-json = "^0.6.7"
lxml = "^6.0.1"
anyio = "^4.10.0"
pyvips = "^3.0.0"
python-multipart = "^0.0.20"

[tool.poetry.group.dev.dependencies]
pre-commit = "^4.3.0"

[tool.isort]
profile = "black"
skip = ["alembic.ini"]
skip_glob = [".*/", ".*", "log/", "*.log"]
line_length = 90
include_trailing_comma = true
force_grid_wrap = 0
use_parentheses = true
ensure_newline_before_comments = true
lines_between_types = 1

[tool.black]
line-length = 90
include = '\.pyi?$'

[tool.ruff]
lint.select = ["E", "F"]
lint.fixable = ["A", "B", "C", "D", "E", "F", "G", "I", "N", "Q", "S", "T", "W", "ANN", "ARG", "BLE", "COM", "DJ", "DTZ", "EM", "ERA", "EXE", "FBT", "ICN", "INP", "ISC", "NPY", "PD", "PGH", "PIE", "PL", "PT", "PTH", "PYI", "RET", "RSE", "RUF", "SIM", "SLF", "TID", "TRY", "UP", "YTT"]
lint.ignore = []
exclude = [
    ".bzr",
    ".direnv",
    ".eggs",
    ".git",
    ".hg",
    ".mypy_cache",
    ".nox",
    ".pants.d",
    ".pytype",
    ".ruff_cache",
    ".svn",
    ".tox",
    ".venv",
    "__pypackages__",
    "_build",
    "buck-out",
    "build",
    "dist",
    "node_modules",
    "venv",
]
lint.per-file-ignores = {}
lint.dummy-variable-rgx = "^(_+|(_+[a-zA-Z0-9_]*[a-zA-Z0-9]+?))$"
line-length = 90
target-version = "py311"
